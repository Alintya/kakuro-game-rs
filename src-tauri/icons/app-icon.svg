<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    App icon source (48 px and up; app-icon-small.svg covers 16–32 px).
    Regenerate the bundled icons with `bun run icons`, not `tauri icon` directly.
    Colours match src/lib/styles/theme.css. Digits are Inter (SIL OFL 1.1) outlines, so
    rendering never depends on installed fonts. The board is a solvable corner:
    across 4 = 1 + 3, across 6 = 2 + 4, down 3 = 1 + 2, down 7 = 3 + 4 (selected cell).
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d78ff" />
      <stop offset="1" stop-color="#2443c4" />
    </linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30333a" />
      <stop offset="1" stop-color="#24262b" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)" />

  <!-- Board; the gaps between tiles are the grid lines. -->
  <rect x="136" y="136" width="752" height="752" rx="72" fill="#15171b" />

